workflowExternalId: wf_icapi_data_pipeline
version: '1'
workflowDefinition:
  tasks:
  - externalId: create_asset_hierarchy_task
    type: transformation
    parameters:
      transformation:
        externalId: create_asset_hierarchy
    name: Task One
    retries: 3
    timeout: 3600
    onFailure: skipTask
  - externalId: contextualize_ts_assets_task
    type: transformation
    parameters:
      transformation:
        externalId: contextualize_ts_assets
    name: Task Two
    retries: 3
    timeout: 3600
    onFailure: skipTask
    dependsOn:
    - externalId: create_asset_hierarchy_task
  - externalId: ep_icapi_datapoints_task
    type: function
    parameters:
      function:
        externalId: ep_icapi_datapoints
        data: {}
    name: Task Three
    retries: 3
    timeout: 3600
    onFailure: abortWorkflow
    dependsOn:
    - externalId: contextualize_ts_assets_task
  - externalId: oee_timeseries_task
    type: function
    parameters:
      function:
        externalId: oee_timeseries
        data: {}
    name: Task Fourth
    retries: 3
    timeout: 3600
    onFailure: abortWorkflow
    dependsOn:
    - externalId: ep_icapi_datapoints_task
